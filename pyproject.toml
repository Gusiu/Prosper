[tool.poetry]
name = "prosper"
version = "0.1.0"
description = "Crypto market analysis tool for Binance SPOT data"
authors = ["Adrian Budzich <Gusiu@yahoo.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
typer = {version = "^0.12.5"}
click = "8.1.7"
rich = "^13.7.0"
polars = "^0.20.0"
requests = "^2.32.3"
pyyaml = "^6.0.1"
tqdm = "^4.66.0"
scikit-learn = "^1.8.0"
torch = "^2.11.0"
pytorch-forecasting = "^1.7.0"
lightning = "^2.6.1"
fastapi = "^0.135.3"
uvicorn = {extras = ["standard"], version = "^0.44.0"}
xgboost = "^1.8.3"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
ruff = "^0.1.0"
mypy = "^1.7.0"
types-PyYAML = "^6.0"
types-requests = "^2.32"

[tool.poetry.scripts]
prosper = "prosper.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N803", "N806", "N812"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.12"
files = ["src/prosper"]
# Third-party analytics and ML packages ship without type information; their
# absence is not a defect in this project.
[[tool.mypy.overrides]]
module = [
    "yaml",
    "pytorch_forecasting.*",
    "lightning.*",
    "xgboost.*",
    "sklearn.*",
]
ignore_missing_imports = true
